<g filter="url(#glow)"><rect x="310.0" y="19.0" width="340" height="62" rx="10" fill="#3a3000" stroke="#f5c542" stroke-width="1.6"/></g>
<text class="t" x="480" y="45" text-anchor="middle" fill="#f5c542">Kolberg.infinite_even  ·  infinite_odd</text>
<text class="s" x="480" y="66" text-anchor="middle">p(n) is even infinitely often, odd infinitely often</text>
<g><rect x="340.0" y="139.0" width="280" height="62" rx="10" fill="#0d2240" stroke="#58a6ff" stroke-width="1.6"/></g>
<text class="t" x="480" y="165" text-anchor="middle" fill="#58a6ff">not_eventually_const</text>
<text class="s" x="480" y="186" text-anchor="middle">p(m) mod 2 is never eventually constant</text>
<g><rect x="30.0" y="269.0" width="280" height="62" rx="10" fill="#0d2240" stroke="#58a6ff" stroke-width="1.6"/></g>
<text class="t" x="170" y="295" text-anchor="middle" fill="#58a6ff">recurrence_mod_two</text>
<text class="s" x="170" y="316" text-anchor="middle">Σₖ p(n − k(3k−1)/2) = 0   (mod 2)</text>
<g><rect x="340.0" y="269.0" width="280" height="62" rx="10" fill="#0d2240" stroke="#58a6ff" stroke-width="1.6"/></g>
<text class="t" x="480" y="295" text-anchor="middle" fill="#58a6ff">pent_gap</text>
<text class="s" x="480" y="316" text-anchor="middle">gap below (j+1)(3j+2)/2 is 2j+1</text>
<g><rect x="650.0" y="269.0" width="280" height="62" rx="10" fill="#0d2240" stroke="#58a6ff" stroke-width="1.6"/></g>
<text class="t" x="790" y="295" text-anchor="middle" fill="#58a6ff">telescoping step</text>
<text class="s" x="790" y="316" text-anchor="middle">rec(G) − rec(G−1) = p(0) = 1 ≠ 0  (mod 2)</text>
<g><rect x="30.0" y="389.0" width="280" height="62" rx="10" fill="#2a1245" stroke="#c084fc" stroke-width="1.6"/></g>
<text class="t" x="170" y="415" text-anchor="middle" fill="#c084fc">Nat.Partition.sum_partition</text>
<text class="s" x="170" y="436" text-anchor="middle">Σₖ (−1)ᵏ p(n − k(3k−1)/2) = 0</text>
<g><rect x="340.0" y="389.0" width="280" height="62" rx="10" fill="#0f2e18" stroke="#3fb950" stroke-width="1.6"/></g>
<text class="t" x="480" y="415" text-anchor="middle" fill="#3fb950">nlinarith</text>
<text class="s" x="480" y="436" text-anchor="middle">nonlinear integer arithmetic</text>
<g><rect x="30.0" y="514.0" width="280" height="62" rx="10" fill="#2a1245" stroke="#c084fc" stroke-width="1.6"/></g>
<text class="t" x="170" y="540" text-anchor="middle" fill="#c084fc">pentagonal number theorem</text>
<text class="s" x="170" y="561" text-anchor="middle">∏ (1 − xⁿ) = Σₖ (−1)ᵏ x^(k(3k−1)/2)</text>
<g><rect x="340.0" y="514.0" width="280" height="62" rx="10" fill="#0f2e18" stroke="#3fb950" stroke-width="1.6"/></g>
<text class="t" x="480" y="540" text-anchor="middle" fill="#3fb950">Euler generating function</text>
<text class="s" x="480" y="561" text-anchor="middle">Σ p(n) xⁿ = ∏ 1 / (1 − xⁿ)</text>
